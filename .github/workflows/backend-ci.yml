name: Backend CI
on:
  push:
    paths: ['backend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ghflusao
          POSTGRES_USER: ghflusao
          POSTGRES_PASSWORD: ghflusao123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghflusao -d ghflusao"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build e Test
        run: cd backend && mvn verify -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: dev
          POSTGRES_JDBC_URL: jdbc:postgresql://localhost:5432/ghflusao
          POSTGRES_USER: ghflusao
          POSTGRES_PASSWORD: ghflusao123
          POSTGRES_SCHEMA: public
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMzItY2hhcnM=
          CORS_ORIGINS: http://localhost:5173
