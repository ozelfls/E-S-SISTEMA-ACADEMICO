name: Backend CI
on:
  push:
    paths: ['backend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build e Test
        run: cd backend && mvn verify -DskipTests=false
        env:
          ORACLE_JDBC_URL: jdbc:oracle:thin:@//localhost:1521/XEPDB1
          ORACLE_USER: test
          ORACLE_PASSWORD: test
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMzItY2hhcnM=
          CORS_ORIGINS: http://localhost:5173
