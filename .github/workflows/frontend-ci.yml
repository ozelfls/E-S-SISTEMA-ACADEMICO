name: Frontend CI
on:
  push:
    paths: ['frontend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm ci && npm run build
        env:
          VITE_API_URL: https://ghflusao-backend.onrender.com/api
