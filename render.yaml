services:
  - type: web
    name: es-sistema-academico-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: es-sistema-academico-db
          property: connectionString
      - key: POSTGRES_USER
        fromDatabase:
          name: es-sistema-academico-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: es-sistema-academico-db
          property: password
      - key: POSTGRES_SCHEMA
        value: public
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ORIGINS
        value: https://es-sistema-academico-frontend.onrender.com
      - key: SWAGGER_ENABLED
        value: "false"
      - key: BOOTSTRAP_DEMO_ADMINS
        value: "false"
      - key: INITIAL_ADMIN_ENABLED
        value: "true"
      - key: INITIAL_ADMIN_LOGIN
        value: blankspace
      - key: INITIAL_ADMIN_PASSWORD
        value: "1234"
      - key: DB_POOL_MAX
        value: "3"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: PORT
        value: "8080"

  - type: web
    name: es-sistema-academico-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://es-sistema-academico-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: es-sistema-academico-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: es_sistema_academico
    user: es_sistema_academico_user
