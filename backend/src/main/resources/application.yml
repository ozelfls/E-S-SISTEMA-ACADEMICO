spring:
  application:
    name: ghflusao

  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/ghflusao}
    username: ${POSTGRES_USER:ghflusao}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: ${POSTGRES_SCHEMA:public}

  flyway:
    enabled: true
    locations: classpath:db/postgres
    baseline-on-migrate: false
    schemas: ${POSTGRES_SCHEMA:public}
    ignore-migration-patterns: []

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

app:
  bootstrap-demo-admins: ${BOOTSTRAP_DEMO_ADMINS:false}
  initial-admin:
    enabled: ${INITIAL_ADMIN_ENABLED:false}
    login: ${INITIAL_ADMIN_LOGIN:}
    password: ${INITIAL_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    baseline-on-migrate: false
    ignore-migration-patterns: []

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: postgres-demo
  flyway:
    locations: classpath:db/postgres,classpath:db/postgres-demo
