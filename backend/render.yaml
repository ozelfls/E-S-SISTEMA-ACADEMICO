services:
  - type: web
    name: ghflusao-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    buildCommand: cd backend && mvn clean package -DskipTests
    envVars:
      - key: POSTGRES_JDBC_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SCHEMA
        value: public
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
      - key: BOOTSTRAP_DEMO_ADMINS
        value: "false"
